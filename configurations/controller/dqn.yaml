_target_: src.controllers.dqn.DQNController
model_kwargs:
  learning_rate: 0.0003
  buffer_size: 200_000
  learning_starts: 10_000
  batch_size: 128
  gamma: 0.99
  # slower exploration decay — the agent needs more time to
  # explore varied scenarios
  exploration_fraction: 0.5
  exploration_final_eps: 0.05
  # target network update frequency — less frequent updates
  # improve stability
  target_update_interval: 1000
  verbose: 1
