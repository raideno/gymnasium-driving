[tool.poetry]
name = "gymnasium-driving"
version = "0.1.0"
description = "A kinematic based model environment for Gymnasium"
authors = ["Nadir KICHOU <nadirkichou@hotmail.fr>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/raideno/gymnasium-driving"
keywords = ["reinforcement-learning", "gymnasium", "autonomous-driving", "bicycle-model", "ackerman-model"]
packages = [
    { include = "gymnasium_driving" }
]

[tool.poetry.dependencies]
python = ">=3.11"
gymnasium = "^1.2.3"
numpy = "^2.4.1"
pygame = "^2.6.1"
kbm = { git = "https://github.com/winstxnhdw/KinematicBicycleModel" }
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.282"
mypy = "^1.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

